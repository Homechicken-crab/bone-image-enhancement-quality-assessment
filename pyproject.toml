[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "bone-iqa-tool"
version = "0.1.1"
description = "Bone Image Enhancement Quality Assessment Tool"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.24",
  "Pillow>=10",
]

[project.scripts]
bone-iqa = "bone_iqa.app:main"

[tool.setuptools.packages.find]
where = ["src"]
